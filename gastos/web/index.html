<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Gastos</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">Gastos</div>
    <div class="month" id="month">
      <button class="icon-btn" data-step="-1" aria-label="Previous month">‹</button>
      <span id="month-label"></span>
      <button class="icon-btn" data-step="1" aria-label="Next month">›</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>

  <nav class="tabbar">
    <a href="#home" data-tab="home"><span>◐</span>Home</a>
    <a href="#list" data-tab="list"><span>≡</span>Movements</a>
    <button class="fab" id="add" aria-label="Add">+</button>
    <a href="#stats" data-tab="stats"><span>▥</span>Stats</a>
    <a href="#settings" data-tab="settings"><span>⚙</span>Settings</a>
  </nav>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
