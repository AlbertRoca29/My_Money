<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Gastos</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/gate.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="desktop-only"><div class="badge">🖥️</div><h1>Desktop only</h1><p>My Money is built for a computer screen. Open it on your desktop or laptop, or widen this window.</p></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><rect style="fill:var(--f,none)" x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4"/><path style="stroke:var(--k,currentColor)" d="M3.5 10h17"/><path style="stroke:var(--k,currentColor);stroke-width:2.6" d="M8.5 15h.01"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path style="fill:var(--f,none)" d="M5.5 3.5h13v17l-2.2-1.4-2.1 1.4-2.2-1.4-2.2 1.4-2.1-1.4-2.2 1.4z"/><path style="stroke:var(--k,currentColor);stroke-width:1.6" d="M9 8.5h6M9 12h6M9 15.5h3.5"/></symbol>
    <symbol id="i-stats" viewBox="0 0 24 24"><path style="stroke-width:2.6" d="M5 20V8M8.6 20v-5.5M15.4 20V11M19 20V5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H17a1 1 0 0 1 1 1v2"/><path d="M4 7.5v10A2.5 2.5 0 0 0 6.5 20H19a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H6.5A2.5 2.5 0 0 1 4 7.5z"/><circle cx="16" cy="14.5" r="1"/></symbol>
    <symbol id="i-growth" viewBox="0 0 24 24"><path d="M3.5 17 9 11.5l4 4L20.5 8"/><path d="M15 8h5.5v5.5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  </svg>

  <header class="topbar">
    <!-- App switcher: one small button; the menu holds both halves. Same markup in ../../templates/index.html -->
    <div class="switcher">
      <button class="app-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Switch app (Gastos)" style="--c:var(--accent)">
        <span class="app-ico"><svg><use href="#i-wallet"/></svg></span><svg class="chev"><use href="#i-chevron"/></svg>
      </button>
      <nav class="app-menu" role="menu" hidden>
        <a href="./" class="on" role="menuitem" style="--c:var(--accent)"><span class="app-ico"><svg><use href="#i-wallet"/></svg></span>
          <span>Gastos<small>Expenses and income</small></span></a>
        <a href="portfolio" role="menuitem" style="--c:var(--blue)"><span class="app-ico"><svg><use href="#i-growth"/></svg></span>
          <span>Portfolio<small>Wealth, returns, exposure</small></span></a>
      </nav>
    </div>
    <nav class="tabs">
      <a href="#home" data-tab="home">Home</a>
      <a href="#list" data-tab="list">Movements</a>
      <a href="#stats" data-tab="stats">Stats</a>
    </nav>
    <div class="month" id="month">
      <button class="month-btn" id="month-btn" aria-haspopup="dialog" aria-expanded="false" aria-label="Pick a month">
        <span id="month-label"></span><svg class="chev"><use href="#i-chevron"/></svg>
      </button>
      <div class="month-pop" id="month-pop" hidden></div>
    </div>
    <button class="icon-btn gear" id="open-settings" aria-label="Settings"><svg><use href="#i-settings"/></svg></button>
    <button class="pill accent" id="add-top"><svg class="ico"><use href="#i-plus"/></svg>Add</button>
  </header>

  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" hidden></div>
  <div id="tip" class="tip" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
